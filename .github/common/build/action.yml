name: build
description: Lint a container's Dockerfile and build it for every platform in its bake file.

inputs:
  container:
    description: Container folder to build.
    required: true
  push:
    description: Publish the built image to the registry.
    required: false
    default: 'true'
  token:
    description: Registry token. Required when push is true.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: immanuwell/dockerfile-roast@1.5.0
      with:
        files: ${{ inputs.container }}/Dockerfile
        preset: production
        no-roast: 'true'
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      if: ${{ inputs.push == 'true' }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - uses: docker/bake-action@v7
      with:
        source: ${{ inputs.container }}
        files: docker-bake.hcl
        push: ${{ inputs.push }}
