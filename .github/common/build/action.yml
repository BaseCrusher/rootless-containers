name: build
description: Lint a container's Dockerfile and build it for every platform in its bake file.

inputs:
  container:
    description: Container folder to build.
    required: true
  push:
    description: Publish the built image to the registry.
    required: false
    default: 'true'
  token:
    description: Registry token. Required when push is true.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: immanuwell/dockerfile-roast@1.6.1
      with:
        files: ${{ inputs.container }}/Dockerfile
        preset: production
        no-roast: 'true'
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - name: Enforce image tag format
      shell: bash
      working-directory: ${{ inputs.container }}
      run: |
        fail=0
        for ref in $(docker buildx bake -f docker-bake.hcl --print 2>/dev/null | jq -r '.target[].tags[]'); do
          tag=${ref##*:}
          case "$tag" in
            latest|dev|latest-debug|dev-debug) continue ;;
          esac
          if [[ ! "$tag" =~ ^.+-[0-9]+(\.[0-9]+)?(-debug)?$ ]]; then
            echo "::error::Tag '$ref' must be <app-version>-Y or <app-version>-Y.Z (e.g. v1.2.3-1 or v1.2.3-1.0), optionally -debug; only latest/dev are exempt"
            fail=1
          fi
        done
        exit $fail
    - uses: docker/login-action@v4
      if: ${{ inputs.push == 'true' }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - uses: docker/bake-action@v7
      with:
        source: ${{ inputs.container }}
        files: docker-bake.hcl
        push: ${{ inputs.push }}
        set: |
          *.cache-from=type=gha,scope=${{ inputs.container }}
          *.cache-to=type=gha,scope=${{ inputs.container }},mode=max
