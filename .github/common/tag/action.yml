name: tag
description: Tag a green build. Creates the immutable git tag <container>-<image-version> (no-op if it exists) and force-moves the rolling tag <container>-<image-version> with the trailing .Z stripped.

inputs:
  container:
    description: Container folder that was built.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.container }}
      run: |
        ref=$(docker buildx bake -f docker-bake.hcl --print 2>/dev/null \
          | jq -r '.target[].tags[]' \
          | grep -E ':.+-[0-9]+\.[0-9]+$' \
          | head -1)
        if [[ -z "$ref" ]]; then
          echo "::error::no versioned image tag found in docker-bake.hcl"
          exit 1
        fi
        tag="${{ inputs.container }}-${ref##*:}"
        rolling="${tag%.*}"
        if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
          echo "tag $tag already exists, skipping"
          exit 0
        fi
        git tag "$tag"
        git push origin "refs/tags/$tag"
        git tag -f "$rolling"
        git push -f origin "refs/tags/$rolling"
        echo "tagged green build as $tag (moved $rolling)"
