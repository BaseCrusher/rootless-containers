name: tag
description: Tag a green build. Creates the immutable git tag <container>-<image-version> (no-op if it exists) and force-moves the rolling tag <container>-<image-version> with the trailing .Z stripped.

inputs:
  container:
    description: Container folder that was built.
    required: true
  app-id:
    description: ID of the GitHub App allowed to bypass the tag ruleset.
    required: true
  private-key:
    description: Private key of that GitHub App.
    required: true

runs:
  using: composite
  steps:
    - id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - shell: bash
      working-directory: ${{ inputs.container }}
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        ref=$(docker buildx bake -f docker-bake.hcl --print 2>/dev/null \
          | jq -r '.target[].tags[]' \
          | grep -E ':.+-[0-9]+\.[0-9]+$' \
          | head -1)
        if [[ -z "$ref" ]]; then
          echo "::error::no versioned image tag found in docker-bake.hcl"
          exit 1
        fi
        tag="${{ inputs.container }}-${ref##*:}"
        rolling="${tag%.*}"
        remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
        if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
          echo "tag $tag already exists, skipping"
          exit 0
        fi
        git tag "$tag"
        git push "$remote" "refs/tags/$tag"
        git tag -f "$rolling"
        git push -f "$remote" "refs/tags/$rolling"
        echo "tagged green build as $tag (moved $rolling)"
