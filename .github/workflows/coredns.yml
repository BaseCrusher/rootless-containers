name: coredns

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - coredns/**
      - .github/workflows/coredns.yml
      - .github/workflows/build.yml
  pull_request:
    paths:
      - coredns/**
      - .github/workflows/coredns.yml
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      container: coredns
      push: ${{ github.event_name != 'pull_request' }}
