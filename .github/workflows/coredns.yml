name: coredns

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - coredns/**
      - .github/workflows/coredns.yml
      - .github/common/**
  pull_request:
    paths:
      - coredns/**
      - .github/workflows/coredns.yml
      - .github/common/**

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/common/build
        with:
          container: coredns
          push: ${{ github.event_name != 'pull_request' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/common/scan
        if: ${{ github.event_name != 'pull_request' }}
        with:
          image: coredns:latest
