name: trivy

on:
  workflow_call:
    inputs:
      image:
        description: Container folder name, scanned as ghcr.io/basecrusher/rootless-containers/<image>.
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [latest, latest-debug]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/common/scan
        with:
          image: ${{ inputs.image }}:${{ matrix.tag }}
