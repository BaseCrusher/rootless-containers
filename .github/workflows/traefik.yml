name: traefik

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - traefik/**
      - .github/workflows/traefik.yml
      - .github/workflows/build.yml
  pull_request:
    paths:
      - traefik/**
      - .github/workflows/traefik.yml
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      container: traefik
      push: ${{ github.event_name != 'pull_request' }}
