name: build

on:
  workflow_call:
    inputs:
      container:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: immanuwell/dockerfile-roast@1.4.11
        with:
          files: ${{ inputs.container }}/Dockerfile
          preset: production
          no-roast: 'true'
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v7
        with:
          source: ${{ inputs.container }}
          files: docker-bake.hcl
          push: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/basecrusher/rootless-containers/${{ inputs.container }}:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
