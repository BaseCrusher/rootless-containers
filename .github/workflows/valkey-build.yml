name: valkey-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - valkey/docker-bake.hcl
  pull_request:
    paths:
      - valkey/docker-bake.hcl

permissions:
  contents: write
  packages: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        uses: ./.github/common/tag-exists
        with:
          container: valkey

  build:
    needs: preflight
    if: ${{ needs.preflight.outputs.exists != 'true' || github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/common/build
        with:
          container: valkey
          push: ${{ github.event_name != 'pull_request' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/common/scan
        if: ${{ github.event_name != 'pull_request' }}
        with:
          image: valkey:latest
      - uses: ./.github/common/tag
        if: ${{ github.event_name != 'pull_request' }}
        with:
          container: valkey
          client-id: ${{ vars.EXTRA_ADMIN_CLIENT_ID }}
          private-key: ${{ secrets.EXTRA_ADMIN_PRIVATE_KEY }}
